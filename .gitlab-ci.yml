
stages:
  - build
  - test

build_job:
  stage: build
  tags:
    - windows-runner
  script:
    - New-Item -ItemType Directory -Force -Path dist
    - Copy-Item index.html dist/
  artifacts:
    paths:
      - dist/

test_job:
  stage: test
  tags:
    - windows-runner
  script:
    - node --version
    - node test.js
